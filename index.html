  });

  m.bindPopup(`<div style="color:#333;font-size:12px"><div style="font-weight:700;font-size:13px;color:#1F3864;margin-bottom:4px">${s.dev}</div>${tenantHTML}<div style="margin-bottom:6px;color:#666">${s.addr}</div><table style="font-size:11px;color:#333"><tr><td style="padding-right:12px">SF</td><td style="text-align:right;font-weight:600">${s.sf}</td></tr><tr><td style="padding-right:12px">Acres</td><td style="text-align:right;font-weight:600">${s.acres}</td></tr><tr><td style="padding-right:12px">Year</td><td style="text-align:right;font-weight:600">${s.year}</td></tr><tr><td style="padding-right:12px">Market</td><td style="text-align:right;font-weight:600">${s.market}</td></tr></table><div style="display:inline-block;margin-top:6px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;background:${s.color}">${s.statusLabel}</div></div>`);
  m.bindTooltip(s.tenant ? `${s.dev} — ${s.tenant}` : s.dev, { direction: "top" });
  m.on("click", () => {
    const siteBounds = L.latLngBounds([[s.lat, s.lon]]);
    map.fitBounds(siteBounds, { padding: [50, 50] });
    m.openPopup();
  });
  
  m._s = s;
  pins.push(m);
});

function showLanding() {
  view = "landing";
  layer.clearLayers();
  document.getElementById("subtitle").textContent = "Midwest Development Portfolio";
  document.getElementById("backbtn").classList.remove("show");
  document.getElementById("legend").classList.remove("show");
  
  MARKETS.forEach(market => {
    const center = MARKET_CENTERS[market];
    const circle = L.circleMarker([center.lat, center.lon], {
      radius: 40,
      fillColor: "#0a3355",
      color: "#d8272d",
      weight: 3,
      opacity: 1,
      fillOpacity: 0.3
    });
    
    circle.bindPopup(`<div style="color:#333"><div style="font-weight:700;color:#1F3864;font-size:13px">${market}</div><div style="color:#666;font-size:11px">${center.count} sites</div></div>`);
    circle.on("click", () => { showDetail(market); });
    layer.addLayer(circle);
  });
  
  const allSiteBounds = L.latLngBounds(SITES.map(s => [s.lat, s.lon]));
  document.getElementById("backbtn").onclick = function() { showLanding(); };
  setTimeout(() => {
    map.fitBounds(allSiteBounds, { padding: [80, 80] });
    setTimeout(() => {
      initialZoom = map.getZoom();
      initialCenter = map.getCenter();
      console.log("Initial view captured - Zoom:", initialZoom, "Center:", initialCenter);
    }, 100);
  }, 50);
}

function showDetail(market) {
  view = "detailed";
  activeMarket = market;
  layer.clearLayers();
  
  const msites = SITES.filter(s => s.market === market);
  pins.forEach(p => {
    if (p._s.market === market) layer.addLayer(p);
  });
  
  document.getElementById("subtitle").textContent = msites.length + " of " + SITES.length + " sites shown";
  document.getElementById("backbtn").classList.add("show");
  document.getElementById("legend").classList.add("show");
  
  if (msites.length) {
    const siteBounds = L.latLngBounds(msites.map(s => [s.lat, s.lon]));
    map.fitBounds(siteBounds, { padding: [50, 50] });
  }
}

const legendHTML = LEGEND.map(l => {
  const count = SITES.filter(s => s.bucket === l.key).length;
  return `<div class="legend-item"><div class="legend-dot" style="background:${l.color}"></div><span class="legend-label">${l.label} (${count})</span></div>`;
}).join("");
document.getElementById("legendbody").innerHTML = legendHTML;

showLanding();
console.log("Portfolio loaded");
</script>
</body></html>
