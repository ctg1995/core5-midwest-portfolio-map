const MARKETS = ["CIN_NKY", "COL", "IND", "LOU", "NJ"];
const LEGEND = [{"key": "sold", "label": "Sold", "color": "#9AA0A6"}, {"key": "active", "label": "Own \u2013 Land / Under Dev / Leasing", "color": "#F2C230"}, {"key": "stabilized", "label": "Own \u2013 Stabilized", "color": "#2E9E5B"}];
const LOOPS = {"COL": {"name": "Columbus", "lat": 39.98, "lng": -82.95, "radius": 35000}, "CIN_NKY": {"name": "Cincinnati / Northern Kentucky", "lat": 39.11, "lng": -84.51, "radius": 35000}, "LOU": {"name": "Louisville", "lat": 38.19, "lng": -85.735, "radius": 35000}, "IND": {"name": "Indianapolis", "lat": 39.78, "lng": -86.13, "radius": 35000}, "NJ": {"name": "New Jersey", "lat": 39.6842, "lng": -75.4052, "radius": 35000}};
const COLORS = {"COL": "#0a3355", "CIN_NKY": "#1a4d6d", "LOU": "#2d5a3d", "IND": "#1f4d3d", "NJ": "#3d2d4d"};

let initialZoom = null;
let initialCenter = null;
let view = "landing";
let activeMarket = MARKETS[0];
let circles = {};
let pins = [];

const map = L.map("map").setView([39, -84.5], 6);

L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution: "© Esri",
  maxZoom: 18
}).addTo(map);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap",
  opacity: 0.6,
  maxZoom: 19
}).addTo(map);

const layer = L.layerGroup().addTo(map);

// Create circles for markets
Object.entries(LOOPS).forEach(([key, loop]) => {
  const circle = L.circle([loop.lat, loop.lng], {
    radius: loop.radius,
    color: COLORS[key],
    weight: 2,
    opacity: 0.8,
    fill: true,
    fillColor: COLORS[key],
    fillOpacity: 0.2
  });
  circle.on("click", () => showDetail(key));
  circles[key] = circle;
});

// Create pin markers
SITES.forEach(s => {
  const icon = L.divIcon({
    html: '<svg width="32" height="44" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C6.48 0 2 4.48 2 10c0 6 10 22 10 22s10-16 10-22c0-5.52-4.48-10-10-10z" fill="' + s.color + '" stroke="white" stroke-width="1.5"/><circle cx="12" cy="10" r="3.5" fill="white"/></svg>',
    iconSize: [32, 44],
    iconAnchor: [16, 44],
    popupAnchor: [0, -44],
    className: "pin"
  });
  
  const m = L.marker([s.lat, s.lon], { icon: icon });
  const ten = s.tenant ? '<div style="color:#d8272d; font-weight:600; font-size:12px; margin-top:2px; padding:3px 6px; background:#f5f5f5; border-radius:2px;">' + s.tenant + '</div>' : '';
  m.bindPopup('<div style="font-weight:700; font-size:13px; color:#1a1a1a; background:#f5f5f5; padding:4px 6px; border-radius:3px;">' + s.dev + '</div>' + ten + '<div style="color:#333; font-size:11px; margin:5px 0 7px; line-height:1.4;">' + s.addr + (s.county ? '<br>' + s.county : '') + '</div><div style="margin-top:5px; font-size:11px; color:#333;"><div>Building SF: ' + s.sf + '</div><div>Acres: ' + s.acres + '</div><div>Year: ' + s.year + '</div><div>Market: ' + s.market + '</div></div>');
  m._s = s;
  pins.push(m);
});

// Build legend
document.getElementById("legendbody").innerHTML = LEGEND.map(l => {
  const count = SITES.filter(s => s.bucket === l.key).length;
  return '<div class="legend-item"><span class="legend-dot" style="background:' + l.color + '"></span><span class="legend-label">' + l.label + ' (' + count + ')</span></div>';
}).join("");

let initialView = null;

function showLanding() {
  view = "landing";
  layer.clearLayers();
  Object.values(circles).forEach(c => layer.addLayer(c));
  document.getElementById("subtitle").textContent = "Midwest Development Portfolio";
  document.getElementById("backbtn").classList.remove("show");
  document.getElementById("legend").classList.remove("show");
  
  if (initialZoom !== null && initialCenter !== null) {
    map.setZoom(initialZoom);
    map.setView(initialCenter);
  }
}

function showDetail(market) {
  view = "detailed";
  activeMarket = market;
  layer.clearLayers();
  
  const msites = SITES.filter(s => s.market === market);
  pins.forEach(p => {
    if (p._s.market === market) layer.addLayer(p);
  });
  
  document.getElementById("subtitle").textContent = msites.length + " of " + SITES.length + " sites shown";
  document.getElementById("backbtn").classList.add("show");
  document.getElementById("legend").classList.add("show");
  
  if (msites.length) {
    const siteBounds = L.latLngBounds(msites.map(s => [s.lat, s.lon]));
    map.fitBounds(siteBounds, { padding: [50, 50] });
  }
}

// Calculate bounds from all sites (not circles)
const allSiteBounds = L.latLngBounds(SITES.map(s => [s.lat, s.lon]));

// Show landing view with tighter bounds
document.getElementById("backbtn").onclick = function() { showLanding(); };

showLanding();

// Fit to sites and capture the exact zoom level and center
setTimeout(() => {
  map.fitBounds(allSiteBounds, { padding: [80, 80] });
  setTimeout(() => {
    initialZoom = map.getZoom();
    initialCenter = map.getCenter();
    console.log("Initial view captured - Zoom:", initialZoom, "Center:", initialCenter);
  }, 100);
}, 50);

console.log("Portfolio loaded");

</script>
